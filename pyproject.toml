# Packaging metadata. The layout rule (ADR-020) still holds: the product
# lives entirely under development/, and the governance tooling under tools/
# is deliberately NOT packaged -- it operates on the repository, not on a
# deployed host, and shipping it would put the merge gate and the context
# firewall on production machines where they mean nothing.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annulon"
version = "0.5.0"
description = "A local-first security agent for cloud Linux servers"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
# No runtime dependencies, on purpose. The sensor is tracefs and the
# enforcement backend drives nft through a fixed argv; neither needs a
# library. A security agent with a dependency tree has a supply chain, and
# this one does not yet need to.
dependencies = []

[project.optional-dependencies]
sdn = ["os-ken>=2.7"]
dev = ["pytest>=8", "cryptography>=42"]
# Release verification needs public-key signatures, which the standard
# library does not provide. It is an extra rather than a runtime dependency
# because the agent and broker never verify anything -- only the installer
# does, and it runs before they exist. The running agent stays dependency
# free, which is where a supply chain would actually hurt.
verify = ["cryptography>=42"]

[project.scripts]
annulon-broker = "annulon.cli.broker:main"
annulon-agent = "annulon.cli.agent:main"
annulon-install = "annulon.supply.install:main"

[tool.setuptools]
package-dir = {"" = "development/src"}

[tool.setuptools.packages.find]
where = ["development/src"]
include = ["annulon*", "sdnguard*"]

[tool.pytest.ini_options]
pythonpath = ["development/src", "."]
testpaths = ["tests", "development/tests"]

# CI for Annulon.
#
# CI is not the merge gate and must not be described as if it were. The gate
# writes its result under memory/runtime/, which is gitignored on purpose so
# a gate result cannot be committed or hand-edited into history -- so no
# clone has one and CI cannot verify that main's tip was gated. That check
# reports N/A here and says why; ADR-059's enforcement is local-only, and
# pretending otherwise is how KF-61 happened.
name: annulon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        # The platform itself is standard library only, which is the property
        # worth keeping true. cryptography is NOT a runtime dependency -- the
        # agent never verifies anything -- but the release-verification tests
        # carry a module-level skipif on the Ed25519 backend. Installing only
        # pytest silently skipped all 55 of them, covering the whole signed
        # install, update, downgrade and rollback path, and the build still
        # went green (KF-61). A skipped test is NOT_RUN, never PASS.
        run: python -m pip install --upgrade pip pytest 'cryptography>=42'

      - name: Full test suite
        # -ra so skips are printed. A skip that nobody sees is how a suite
        # quietly stops covering what it claims to.
        run: python -m pytest -q -ra

      - name: No release test may silently skip
        # The suite above passes whether or not those tests ran, so assert
        # the condition that would skip them rather than trusting the exit
        # code. verify_all's signature_backend check does the same thing for
        # a developer machine.
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "development/src")
          from annulon.supply.manifest import signing_available
          if not signing_available():
              sys.exit("no Ed25519 backend: the signed-release suite would "
                       "skip and this build would still be green")
          print("signature backend present")
          PY

      - name: Standing invariants
        # Re-checks framework boundaries, the privileged-action invariant,
        # the context firewall, memory integrity and committed secrets.
        # --no-local-evidence: see the header.
        run: python tools/verify_all.py --no-local-evidence
